<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f1"><title>LINE着せかえ制作室｜プレビュー</title><link rel="stylesheet" href="./css/style.css"></head>
<body><header class="app-header"><div><p class="eyebrow">LINE着せかえ制作室 · Phase 1</p><h1>カラースキンを選ぶ</h1></div><span class="count" id="skin-count">読み込み中</span></header>
<main><section class="preview-section" aria-label="トーク画面プレビュー"><div class="section-heading"><div><h2>完成イメージ</h2><p id="selected-name">スキンを選択してください</p></div><label class="upload-button">背景画像を登録<input type="file" id="background-input" accept="image/png,image/jpeg,image/webp,image/heic,image/heif" hidden></label></div><div class="phone-frame"><div class="talk-header" id="talk-header"><span class="back-mark" aria-hidden="true">‹</span><strong>トーク</strong><span class="header-dots" aria-hidden="true">•••</span></div><div class="talk-area" id="talk-area"><div class="message-row other"><div class="avatar" aria-hidden="true">相</div><div class="bubble" id="other-bubble">こんにちは</div></div><div class="message-row own"><div class="bubble" id="own-bubble">よろしく！</div></div></div><div class="talk-footer" aria-label="入力欄の仮表示"><span>＋</span><div class="input-mock"></div><span>☺</span></div></div><div class="background-actions"><span id="background-status" role="status">背景画像：未登録</span><button id="remove-background" type="button" hidden>背景を外す</button></div><p class="notice">配色は実測値ベースの参考表示です。画像と選択内容は現在保存されません。</p></section>
<section class="picker-section" aria-label="カラースキン一覧"><div class="picker-title"><h2>カラースキン</h2><p>9系統・全50種類。タップするとプレビューが切り替わります。</p></div><div id="skin-groups" class="skin-groups"></div><p id="load-error" class="error" role="alert" hidden></p></section></main><script type="module" src="./js/app.js"></script></body></html>
