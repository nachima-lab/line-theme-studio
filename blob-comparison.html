<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <title>LINE着せかえ制作室｜原画のデコード比較</title>
 <link rel="stylesheet" href="./css/diagnostic.css">
</head>
<body>
 <main>
  <h1>原画のデコード比較</h1>
  <p>トーク OFFと通話 OFFを比較します。直列で全件成功した場合は、2枚を並列でも確認します。保存データは変更しません。</p>
  <dl>
   <dt>保存元</dt><dd id="diagnostic-origin"></dd>
   <dt>診断対象</dt><dd><label for="diagnostic-project">作品</label>
    <select id="diagnostic-project" disabled></select></dd>
  </dl>
  <div class="actions">
   <button id="diagnostic-start" type="button" disabled>診断する</button>
   <button id="diagnostic-copy" type="button" disabled>結果をコピー</button>
  </div>
  <p id="diagnostic-status" role="status">保存済みの作品を確認中…</p>
  <label for="diagnostic-report">診断結果</label>
  <textarea id="diagnostic-report" rows="18" readonly spellcheck="false"></textarea>
 </main>
 <script type="module" src="./js/blob-comparison-page.js"></script>
</body>
</html>
